spring.application.name=supermercado-mcp

# ---- Servidor MCP (Spring AI, Streamable HTTP) ----
spring.ai.mcp.server.name=supermercado-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.stdio=false

# Puerto distinto al de labmcp (8088) para poder correr ambos servidores a la vez
server.port=8089

logging.file.name=./logs/supermercado-mcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=INFO

# ---- MySQL (la base se crea sola si no existe; la clave viene de la variable de entorno PWD_UDEA) ----
spring.datasource.url=jdbc:mysql://localhost:3306/supermercado_mcp?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
